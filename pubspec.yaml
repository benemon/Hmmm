name: hmmm
description: "Offline period, HRT, and symptom tracker."
publish_to: 'none'
version: 0.3.2+9

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  sqflite: ^2.4.3
  share_plus: ^13.3.0
  pdf: ^3.13.0
  printing: ^5.15.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
  assets:
    - brand/letterhead.svg
  fonts:
    - family: Public Sans
      fonts:
        - asset: assets/fonts/PublicSans-Regular.ttf
        - asset: assets/fonts/PublicSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PublicSans-SemiBold.ttf
          weight: 600
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
