name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          printf '%s\nstoreFile=%s\n' "$ANDROID_KEY_PROPERTIES" "$RUNNER_TEMP/release-keystore.jks" > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - run: mkdir dist && cp build/app/outputs/apk/release/hmmm-*-arm64-v8a-release.apk dist/
      - run: flutter build apk --release
      - run: cp build/app/outputs/apk/release/hmmm-*-release.apk dist/
      - name: Merged manifest requests no network permission and declares backup rules
        run: |
          manifest=build/app/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          test -f "$manifest"
          ! grep -q 'android.permission.INTERNET' "$manifest"
          grep -q 'android:dataExtractionRules=' "$manifest"
          grep -q 'android:fullBackupContent=' "$manifest"
      - name: APKs are signed with the release key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do
            "$apksigner" verify --print-certs "$apk" | grep -q 'SHA-256 digest: e396e9797fa5792eae9e594eb887961417e1bf9c9b58dd1d3f25af29cebbc6c3'
          done
      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.jks" android/key.properties
      - name: Publish release with the APKs attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          version="${GITHUB_REF_NAME#v}"
          out=dist
          gh release create "$GITHUB_REF_NAME" \
            "$out/hmmm-$version-arm64-v8a-release.apk#Hmmm $GITHUB_REF_NAME (arm64, most phones)" \
            "$out/hmmm-$version-release.apk#Hmmm $GITHUB_REF_NAME (universal)" \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")"
