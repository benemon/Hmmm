name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - run: mkdir dist && cp build/app/outputs/apk/release/hmmm-*-arm64-v8a-release.apk dist/
      - run: flutter build apk --release
      - run: cp build/app/outputs/apk/release/hmmm-*-release.apk dist/
      - name: Merged manifest requests no network permission and declares backup rules
        run: |
          manifest=build/app/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          test -f "$manifest"
          ! grep -q 'android.permission.INTERNET' "$manifest"
          grep -q 'android:dataExtractionRules=' "$manifest"
          grep -q 'android:fullBackupContent=' "$manifest"
      - name: Publish release with the APKs attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          version="${GITHUB_REF_NAME#v}"
          out=dist
          gh release create "$GITHUB_REF_NAME" \
            "$out/hmmm-$version-arm64-v8a-release.apk#Hmmm $GITHUB_REF_NAME (arm64, most phones)" \
            "$out/hmmm-$version-release.apk#Hmmm $GITHUB_REF_NAME (universal)" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag
